name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: http://localhost
          VITE_SUPABASE_ANON_KEY: ci

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS/RPC tests
        run: bash supabase/tests/run.sh
      - name: Backup + restore round trip
        env:
          BACKUP_PASSPHRASE: ci-only-passphrase
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ff_rls_test
        run: |
          bash scripts/backup-db.sh out
          bash scripts/verify-backup.sh out/*.tgz.enc
